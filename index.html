<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Dreamcore Web Starter Kit (A-Frame)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    #hud { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; background: rgba(0,0,0,.4); border-radius: 8px; color: #fff; z-index: 2; font-family: system-ui, sans-serif; }
    #start { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 2; }
    #start button { padding: 12px 20px; font-size: 16px; border-radius: 8px; background: #3a3a6b; color: white; border: none; }
  </style>
</head>
<body>
  <div id="hud">Scene: Entrance</div>
  <div id="start">
     <button id="startBtn">Dream Start</button>
  </div>

  <a-scene id="scene" fog="type: linear; color: #111; near: 1; far: 60" embedded>
    <!-- Entrance Scene -->
    <a-entity id="sceneEntrance" visible="true">
      <a-plane rotation="-90 0 0" width="40" height="40" color="#2a2a2a"></a-plane>
      <a-box position="-6 2 0" width="0.5" height="4" depth="24" color="#555"></a-box>
      <a-box position="6 2 0" width="0.5" height="4" depth="24" color="#555"></a-box>
      <!-- Simple doorway indicator -->
      <a-box id="entranceDoor" position="0 2.2 -18" width="2" height="4" depth="0.3" color="#999"></a-box>
      
      <!-- Player rig -->
      <a-entity id="rig" position="0 1.6 0">
        <a-entity id="player" camera look-controls wasd-controls="enabled: true"></a-entity>
      </a-entity>
    </a-entity>

    <!-- Mirror Hall Scene -->
    <a-entity id="sceneMirror" visible="false">
      <a-plane rotation="-90 0 0" width="40" height="40" color="#1c1c1c"></a-plane>
      <a-box position="-12 2 0" width="0.5" height="4" depth="30" color="#555"></a-box>
      <a-box position="12 2 0" width="0.5" height="4" depth="30" color="#555"></a-box>
      <a-box position="0 2  -12" width="10" height="6" depth="0.5" color="#a0a0a0" material="opacity:0.3; transparent: true"></a-box>
    </a-entity>

    <!-- Final Door Scene -->
    <a-entity id="sceneFinal" visible="false">
      <a-plane rotation="-90 0 0" width="40" height="40" color="#0a0a0a"></a-plane>
      <a-box position="0 2 -15" width="6" height="4" depth="0.6" color="#555"></a-box>
      <a-entity id="finalDoor" geometry="primitive: box; width: 2; height: 3; depth: 0.3" position="0 1  -9" material="color:#777"></a-entity>
    </a-entity>
  </a-scene>

  <script src="./main.js"></script>
</body>
</html>
